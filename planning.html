<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071426">

<title>PLANNING 1 | PROTOTYPE#4</title>

<style>
:root {
  --bg: #071426;
  --panel: #10233b;
  --panel2: #162e49;
  --blue: #1685ff;
  --cyan: #43d9ff;
  --text: #f3f8ff;
  --muted: #9fb4ce;
  --border: rgba(151,190,235,.19);
  --green: #20d6a0;
  --red: #ff667b;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  padding: 16px;
  background:
    radial-gradient(ellipse at top left, #17385b 0, transparent 42%),
    linear-gradient(145deg, #06101e, var(--bg));
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  min-height: 100vh;
}

.container {
  width: 100%;
  max-width: 1800px;
  margin: auto;
}

/* HEADER */

.header {
  position: relative;
  overflow: hidden;
  padding: 24px 22px;
  border-radius: 20px;
  border: 1px solid rgba(110,190,255,.35);
  background: linear-gradient(135deg, #164c80, #0b2340 65%, #102e50);
  box-shadow:
    0 10px 25px rgba(0,0,0,.28),
    inset 0 1px 1px rgba(255,255,255,.16);
}

.header::after {
  content: "";
  position: absolute;
  width: 230px;
  height: 230px;
  right: -90px;
  top: -130px;
  border-radius: 50%;
  background: rgba(67,217,255,.12);
}

.header h1 {
  position: relative;
  z-index: 1;
  margin: 0;
  font-size: clamp(22px, 4vw, 34px);
  font-weight: 900;
  letter-spacing: 1px;
}

.header p {
  position: relative;
  z-index: 1;
  margin: 9px 0 0;
  color: #c9e6ff;
  font-size: 13px;
  line-height: 1.6;
}

/* STATUS */

.status-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin: 16px 0;
}

.status-card {
  min-width: 0;
  padding: 17px;
  border-radius: 15px;
  background: linear-gradient(145deg, #142b45, #0c1b2e);
  border: 1px solid var(--border);
  box-shadow: inset 0 1px 1px rgba(255,255,255,.07);
}

.status-label {
  color: var(--muted);
  font-size: 11px;
  font-weight: bold;
  letter-spacing: .8px;
}

.status-value {
  margin-top: 8px;
  font-size: clamp(19px, 3vw, 29px);
  font-weight: 900;
  overflow-wrap: anywhere;
}

.blue {
  color: var(--cyan);
}

.green {
  color: var(--green);
}

/* PANEL */

.panel {
  padding: 17px;
  margin-top: 15px;
  border-radius: 18px;
  background: linear-gradient(145deg, #10243b, #0a1728);
  border: 1px solid var(--border);
  box-shadow: 0 8px 25px rgba(0,0,0,.2);
}

.toolbar {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 14px;
}

.search-box {
  position: relative;
  flex: 1;
  min-width: 0;
}

.search-box input {
  width: 100%;
  min-height: 46px;
  padding: 12px 15px;
  border-radius: 11px;
  outline: none;
  border: 1px solid rgba(109,177,255,.3);
  background: #071629;
  color: white;
  font-size: 14px;
}

.search-box input:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 0 3px rgba(67,217,255,.1);
}

button {
  min-height: 44px;
  border: 0;
  border-radius: 11px;
  padding: 11px 16px;
  color: white;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
  background: linear-gradient(145deg, #2095ff, #075ac7);
  box-shadow:
    0 4px 10px rgba(0,0,0,.24),
    inset 0 1px 1px rgba(255,255,255,.25);
}

button:active {
  transform: scale(.98);
}

button:disabled {
  opacity: .55;
  cursor: wait;
}

.info-line {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 8px;
  color: var(--muted);
  font-size: 12px;
  margin: 0 0 12px;
}

/* TABLE */

.table-wrapper {
  width: 100%;
  max-height: 72vh;
  overflow: auto;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #081729;
  -webkit-overflow-scrolling: touch;
}

table {
  width: max-content;
  min-width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 12px;
}

thead th {
  position: sticky;
  top: 0;
  z-index: 3;
  padding: 13px 14px;
  text-align: center;
  white-space: nowrap;
  color: #ffffff;
  background: linear-gradient(180deg, #1769a7, #104674);
  border-right: 1px solid rgba(255,255,255,.12);
  border-bottom: 2px solid #43d9ff;
}

tbody td {
  padding: 11px 14px;
  white-space: nowrap;
  border-right: 1px solid rgba(151,190,235,.10);
  border-bottom: 1px solid rgba(151,190,235,.10);
  color: #e1ecfa;
}

tbody tr:nth-child(even) {
  background: rgba(36,75,115,.22);
}

tbody tr:hover {
  background: rgba(22,133,255,.16);
}

tbody tr:last-child td {
  border-bottom: none;
}

tbody td:first-child {
  color: #8fdcff;
  font-weight: bold;
}

.empty {
  padding: 30px !important;
  text-align: center;
  color: var(--muted) !important;
  white-space: normal !important;
}

.message {
  margin: 12px 0;
  padding: 12px 14px;
  border-radius: 10px;
  font-size: 13px;
  line-height: 1.6;
  display: none;
}

.message.error {
  display: block;
  color: #ffd9df;
  background: rgba(255,70,100,.12);
  border: 1px solid rgba(255,70,100,.35);
}

.message.success {
  display: block;
  color: #b8ffe8;
  background: rgba(32,214,160,.09);
  border: 1px solid rgba(32,214,160,.25);
}

.footer {
  padding: 18px 5px 8px;
  text-align: center;
  color: #829ab6;
  font-size: 11px;
  line-height: 1.8;
}

@media (max-width: 600px) {
  body {
    padding: 10px;
  }

  .header {
    padding: 20px 16px;
    border-radius: 15px;
  }

  .status-grid {
    gap: 7px;
  }

  .status-card {
    padding: 12px 10px;
    border-radius: 12px;
  }

  .status-label {
    font-size: 9px;
    letter-spacing: 0;
  }

  .status-value {
    font-size: 21px;
  }

  .panel {
    padding: 11px;
    border-radius: 14px;
  }

  .toolbar {
    flex-wrap: wrap;
  }

  .search-box {
    flex-basis: 100%;
  }

  .toolbar button {
    flex: 1;
  }

  .table-wrapper {
    max-height: 68vh;
  }

  table {
    font-size: 11px;
  }

  thead th,
  tbody td {
    padding: 10px 11px;
  }
}
</style>
</head>

<body>
<div class="container">

  <header class="header">
    <h1>PLANNING 1</h1>
    <p>
      DATA PRODUKSI &amp; PERENCANAAN<br>
      SPREADSHEET PROTOTYPE#4
    </p>
  </header>

  <section class="status-grid">
    <div class="status-card">
      <div class="status-label">TOTAL DATA</div>
      <div class="status-value blue" id="totalData">0</div>
    </div>

    <div class="status-card">
      <div class="status-label">HASIL PENCARIAN</div>
      <div class="status-value green" id="hasilData">0</div>
    </div>

    <div class="status-card">
      <div class="status-label">STATUS</div>
      <div class="status-value" id="statusData"
           style="font-size:17px">MEMUAT</div>
    </div>
  </section>

  <main class="panel">

    <div class="toolbar">
      <div class="search-box">
        <input
          id="cari"
          type="search"
          placeholder="Cari HARI, KODE PRODUK, WOM, MOTIF..."
          autocomplete="off"
          aria-label="Cari data planning">
      </div>

      <button id="btnMuat" onclick="muatData()">
        ↻ MUAT ULANG
      </button>
    </div>

    <div class="info-line">
      <span id="infoJumlah">Menyiapkan data...</span>
      <span id="waktuUpdate">Belum diperbarui</span>
    </div>

    <div id="pesan" class="message"></div>

    <div class="table-wrapper">
      <table>
        <thead id="kepalaTabel"></thead>
        <tbody id="isiTabel">
          <tr>
            <td class="empty">Sedang mengambil data...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>

  <footer class="footer">
    PLANNING 1 · PROTOTYPE#4<br>
    Data ditampilkan dari Google Spreadsheet
  </footer>

</div>

<script>
'use strict';

// =====================================================
// URL WEB APP GOOGLE APPS SCRIPT
// =====================================================

const API_URL =
  'https://script.google.com/macros/s/AKfycbyTTPBudAFT_MWzLhm_MQ8vLJhhLdavB0iakMu6nLTTEDZni3RjTnESogOFDk3qil_P6Q/exec';

// =====================================================
// PENYIMPANAN DATA
// =====================================================

let semuaData = [];
let headerData = [];
let sedangMemuat = false;

// =====================================================
// ELEMEN HTML
// =====================================================

const el = id => document.getElementById(id);

// =====================================================
// ESCAPE HTML UNTUK KEAMANAN
// =====================================================

function aman(teks) {
  return String(teks ?? '').replace(/[&<>"']/g, function(c) {
    return {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[c];
  });
}

// =====================================================
// PESAN STATUS
// =====================================================

function tampilPesan(teks, jenis) {
  const kotak = el('pesan');
  kotak.className = 'message ' + jenis;
  kotak.textContent = teks;
}

function hapusPesan() {
  const kotak = el('pesan');
  kotak.className = 'message';
  kotak.textContent = '';
}

// =====================================================
// AMBIL DATA DARI APPS SCRIPT
// =====================================================

async function muatData() {

  if (sedangMemuat) return;

  sedangMemuat = true;
  el('btnMuat').disabled = true;
  el('btnMuat').textContent = 'MEMUAT...';
  el('statusData').textContent = 'MEMUAT';
  hapusPesan();

  if (semuaData.length === 0) {
    el('isiTabel').innerHTML =
      '<tr><td class="empty">Sedang mengambil data...</td></tr>';
  }

  try {

    const url = API_URL +
      (API_URL.includes('?') ? '&' : '?') +
      '_=' + Date.now();

    const response = await fetch(url, {
      method: 'GET',
      redirect: 'follow',
      cache: 'no-store'
    });

    if (!response.ok) {
      throw new Error('HTTP ' + response.status);
    }

    const hasil = await response.json();

    if (!hasil || hasil.sukses !== true) {
      throw new Error(
        hasil && hasil.error
          ? hasil.error
          : 'Format data API tidak sesuai.'
      );
    }

    if (!Array.isArray(hasil.header) ||
        !Array.isArray(hasil.data)) {
      throw new Error('Header atau data tidak ditemukan.');
    }

    headerData = hasil.header;
    semuaData = hasil.data;

    el('totalData').textContent =
      semuaData.length.toLocaleString('id-ID');

    el('statusData').textContent = 'ONLINE';

    el('waktuUpdate').textContent =
      'Diperbarui: ' + new Date().toLocaleTimeString('id-ID');

    tampilkanTabel();

    tampilPesan(
      'Data berhasil dimuat dari spreadsheet ' +
      'PROTOTYPE#4, tab PLANNING 1.',
      'success'
    );

  } catch (error) {

    console.error(error);

    el('statusData').textContent = 'ERROR';

    tampilPesan(
      'Data gagal dimuat. Periksa deployment Apps Script, ' +
      'izin akses Web App, dan apakah API dapat dibuka. ' +
      'Detail: ' + error.message,
      'error'
    );

    if (semuaData.length === 0) {
      el('kepalaTabel').innerHTML = '';
      el('isiTabel').innerHTML =
        '<tr><td class="empty">' +
        'Data belum berhasil dimuat. Tekan MUAT ULANG setelah memperbaiki API.' +
        '</td></tr>';
      el('infoJumlah').textContent = 'Data tidak tersedia';
      el('hasilData').textContent = '0';
    }

  } finally {

    sedangMemuat = false;
    el('btnMuat').disabled = false;
    el('btnMuat').textContent = '↻ MUAT ULANG';

  }
}

// =====================================================
// TAMPILKAN TABEL
// =====================================================

function tampilkanTabel() {

  const kata = el('cari').value
    .trim()
    .toLocaleLowerCase('id-ID');

  const hasil = semuaData.filter(function(baris) {
    return baris.some(function(nilai) {
      return String(nilai ?? '')
        .toLocaleLowerCase('id-ID')
        .includes(kata);
    });
  });

  // HEADER
  el('kepalaTabel').innerHTML =
    '<tr>' +
    headerData.map(function(judul) {
      return '<th>' + aman(judul || '-') + '</th>';
    }).join('') +
    '</tr>';

  // BARIS DATA
  if (hasil.length === 0) {

    el('isiTabel').innerHTML =
      '<tr><td class="empty" colspan="' +
      Math.max(headerData.length, 1) +
      '">' +
      (semuaData.length === 0
        ? 'Belum ada data.'
        : 'Data tidak ditemukan.') +
      '</td></tr>';

  } else {

    el('isiTabel').innerHTML = hasil.map(function(baris) {

      return '<tr>' +
        headerData.map(function(_, index) {
          return '<td>' +
            aman(baris[index] ?? '') +
            '</td>';
        }).join('') +
        '</tr>';

    }).join('');

  }

  el('hasilData').textContent =
    hasil.length.toLocaleString('id-ID');

  el('infoJumlah').textContent =
    'Menampilkan ' +
    hasil.length.toLocaleString('id-ID') +
    ' dari ' +
    semuaData.length.toLocaleString('id-ID') +
    ' baris data';

}

// =====================================================
// PENCARIAN LANGSUNG
// =====================================================

el('cari').addEventListener('input', tampilkanTabel);

// =====================================================
// MULAI APLIKASI
// =====================================================

muatData();
</script>

</body>
</html>
