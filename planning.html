<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071426">

<title>PLANNING 1 | PROTOTYPE#4</title>

<style>
:root {
  --bg: #071426;
  --panel: #10233b;
  --panel2: #162e49;
  --blue: #1685ff;
  --cyan: #43d9ff;
  --text: #f3f8ff;
  --muted: #9fb4ce;
  --border: rgba(151,190,235,.19);
  --green: #20d6a0;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  padding: 10px;
  background:
    radial-gradient(ellipse at top left, #17385b 0, transparent 42%),
    linear-gradient(145deg, #06101e, var(--bg));
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  min-height: 100vh;
}

.container {
  width: 100%;
  max-width: 1800px;
  margin: auto;
}

/* =====================================================
   HEADER UTAMA
===================================================== */

.header {
  position: relative;
  overflow: hidden;
  padding: 20px 18px;
  border-radius: 17px;
  border: 1px solid rgba(110,190,255,.35);
  background: linear-gradient(
    135deg,
    #164c80,
    #0b2340 65%,
    #102e50
  );
  box-shadow:
    0 8px 20px rgba(0,0,0,.24),
    inset 0 1px 1px rgba(255,255,255,.16);
}

.header::after {
  content: "";
  position: absolute;
  width: 230px;
  height: 230px;
  right: -90px;
  top: -130px;
  border-radius: 50%;
  background: rgba(67,217,255,.12);
}

.header h1 {
  position: relative;
  z-index: 1;
  margin: 0;
  font-size: clamp(24px, 4vw, 35px);
  font-weight: 900;
  letter-spacing: 1px;
}

.header p {
  position: relative;
  z-index: 1;
  margin: 7px 0 0;
  color: #c9e6ff;
  font-size: 14px;
  font-weight: 700;
  line-height: 1.6;
}

/* =====================================================
   STATUS - SATU BARIS SLIM
===================================================== */

.status-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 6px;
  margin: 9px 0;
}

.status-card {
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 3px;
  padding: 7px 9px;
  border-radius: 9px;
  background: linear-gradient(145deg, #142b45, #0c1b2e);
  border: 1px solid var(--border);
  box-shadow: inset 0 1px 1px rgba(255,255,255,.05);
}

.status-label {
  color: var(--muted);
  font-size: 10px;
  font-weight: 900;
  letter-spacing: .2px;
  line-height: 1.3;
}

.status-value {
  margin: 0;
  font-size: clamp(17px, 3vw, 23px);
  font-weight: 900;
  line-height: 1.2;
  overflow-wrap: anywhere;
}

.blue {
  color: var(--cyan);
}

.green {
  color: var(--green);
}

/* =====================================================
   PANEL
===================================================== */

.panel {
  padding: 11px;
  margin-top: 9px;
  border-radius: 14px;
  background: linear-gradient(145deg, #10243b, #0a1728);
  border: 1px solid var(--border);
  box-shadow: 0 8px 22px rgba(0,0,0,.18);
}

.toolbar {
  display: flex;
  gap: 9px;
  align-items: center;
  margin-bottom: 10px;
}

.search-box {
  position: relative;
  flex: 1;
  min-width: 0;
}

.search-box input {
  width: 100%;
  min-height: 44px;
  padding: 11px 13px;
  border-radius: 10px;
  outline: none;
  border: 1px solid rgba(109,177,255,.3);
  background: #071629;
  color: white;
  font-size: 15px;
  font-weight: 800;
}

.search-box input::placeholder {
  color: #9fb4ce;
  font-weight: 700;
}

.search-box input:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 0 3px rgba(67,217,255,.1);
}

button {
  min-height: 42px;
  border: 0;
  border-radius: 10px;
  padding: 10px 14px;
  color: white;
  font-size: 14px;
  font-weight: 900;
  cursor: pointer;
  background: linear-gradient(145deg, #2095ff, #075ac7);
  box-shadow:
    0 4px 10px rgba(0,0,0,.24),
    inset 0 1px 1px rgba(255,255,255,.25);
}

button:active {
  transform: scale(.98);
}

button:disabled {
  opacity: .55;
  cursor: wait;
}

.info-line {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 7px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 800;
  margin: 0 0 10px;
}

/* =====================================================
   TABEL
===================================================== */

.table-wrapper {
  width: 100%;
  max-height: 72vh;
  overflow: auto;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: #081729;
  -webkit-overflow-scrolling: touch;
}

table {
  width: max-content;
  min-width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 15px;
  font-weight: 900;
}

/* =====================================================
   HEADER ASLI SPREADSHEET
   TIDAK MENAMBAHKAN HEADER PRODUKSI/WARNA
===================================================== */

thead th {
  position: sticky;
  padding: 12px 11px;
  text-align: center;
  vertical-align: middle;
  white-space: nowrap;
  color: #fff;
  background: linear-gradient(180deg, #1769a7, #104674);
  border-right: 1px solid rgba(255,255,255,.12);
  border-bottom: 2px solid #43d9ff;
  font-size: 15px;
  font-weight: 900;
}

/* Baris pertama header asli */

thead tr:nth-child(1) th {
  top: 0;
  z-index: 8;
}

/* Baris kedua header asli */

thead tr:nth-child(2) th {
  top: 40px;
  z-index: 7;
}

/* Baris ketiga header asli */

thead tr:nth-child(3) th {
  top: 80px;
  z-index: 6;
}

/* Header keempat dan seterusnya, jika ada */

thead tr:nth-child(n+4) th {
  position: static;
}

/* Header DEV (Pcs) tetap mengikuti warna header */

thead th.dev-header {
  color: #ffffff !important;
  font-weight: 900 !important;
}

/* =====================================================
   ISI TABEL
===================================================== */

tbody td {
  padding: 12px 11px;
  white-space: nowrap;
  border-right: 1px solid rgba(20,50,70,.12);
  border-bottom: 1px solid rgba(20,50,70,.12);
  color: #17283b;
  font-size: 15px;
  font-weight: 900;
  vertical-align: middle;
}

/* =====================================================
   WARNA BARIS BERDASARKAN FP
===================================================== */

tbody tr.fp-1 td {
  background-color: #ffdce5;
}

tbody tr.fp-2 td {
  background-color: #d9edff;
}

tbody tr.fp-4 td {
  background-color: #fff2bf;
}

tbody tr.fp-5 td {
  background-color: #d9f5df;
}

tbody tr.fp-6 td {
  background-color: #eadfff;
}

tbody tr.fp-7 td {
  background-color: #ead6c3;
}

/* GARIS PEMISAH */

tbody tr td {
  border-right-color: rgba(30,55,80,.13);
  border-bottom-color: rgba(30,55,80,.13);
}

/* HOVER */

tbody tr:hover td {
  filter: brightness(.96);
}

/* KOLOM PERTAMA */

tbody td:first-child {
  font-weight: 900;
}

/* =====================================================
   DEV (Pcs) - MERAH DARAH
   HANYA ISI DATA, BUKAN HEADER
===================================================== */

tbody td.dev-pcs {
  color: #c00000 !important;
  font-weight: 900 !important;
}

/* Warna merah tetap terlihat ketika baris di-hover */

tbody tr:hover td.dev-pcs {
  color: #c00000 !important;
}

/* =====================================================
   PESAN KOSONG
===================================================== */

.empty {
  padding: 30px !important;
  text-align: center;
  color: var(--muted) !important;
  background: #081729 !important;
  white-space: normal !important;
  font-size: 14px !important;
  font-weight: 900 !important;
}

/* =====================================================
   PESAN STATUS
===================================================== */

.message {
  margin: 10px 0;
  padding: 11px 13px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 800;
  line-height: 1.6;
  display: none;
}

.message.error {
  display: block;
  color: #ffd9df;
  background: rgba(255,70,100,.12);
  border: 1px solid rgba(255,70,100,.35);
}

.message.success {
  display: block;
  color: #b8ffe8;
  background: rgba(32,214,160,.09);
  border: 1px solid rgba(32,214,160,.25);
}

.footer {
  padding: 15px 5px 7px;
  text-align: center;
  color: #829ab6;
  font-size: 12px;
  font-weight: 800;
  line-height: 1.8;
}

/* =====================================================
   RESPONSIVE HP
===================================================== */

@media (max-width: 600px) {

  body {
    padding: 8px;
  }

  .header {
    padding: 17px 13px;
    border-radius: 13px;
  }

  .header h1 {
    font-size: 25px;
  }

  .header p {
    font-size: 13px;
  }

  .status-grid {
    grid-template-columns: 1fr 1fr 1fr;
    gap: 5px;
    margin: 8px 0;
  }

  .status-card {
    padding: 7px 6px;
    border-radius: 9px;
    gap: 4px;
  }

  .status-label {
    font-size: 9px;
    letter-spacing: 0;
    line-height: 1.25;
  }

  .status-value {
    font-size: 18px;
    line-height: 1.2;
  }

  #statusData {
    font-size: 14px !important;
  }

  .panel {
    padding: 9px;
    border-radius: 12px;
  }

  .toolbar {
    flex-wrap: wrap;
    gap: 7px;
  }

  .search-box {
    flex-basis: 100%;
  }

  .toolbar button {
    width: 100%;
  }

  .info-line {
    font-size: 12px;
  }

  .table-wrapper {
    max-height: 68vh;
  }

  table {
    font-size: 15px;
  }

  thead th {
    padding: 12px 10px;
    font-size: 15px;
  }

  tbody td {
    padding: 12px 10px;
    font-size: 15px;
  }

  thead tr:nth-child(1) th {
    top: 0;
  }

  thead tr:nth-child(2) th {
    top: 40px;
  }

  thead tr:nth-child(3) th {
    top: 80px;
  }

  .footer {
    font-size: 11px;
  }
}
</style>
</head>

<body>
<div class="container">

  <header class="header">
    <h1>PLANNING 1</h1>
    <p>
      DATA PRODUKSI &amp; PERENCANAAN<br>
      SPREADSHEET PROTOTYPE#4
    </p>
  </header>

  <!-- STATUS SATU BARIS -->

  <section class="status-grid">

    <div class="status-card">
      <div class="status-label">TOTAL DATA</div>
      <div class="status-value blue" id="totalData">0</div>
    </div>

    <div class="status-card">
      <div class="status-label">HASIL CARI</div>
      <div class="status-value green" id="hasilData">0</div>
    </div>

    <div class="status-card">
      <div class="status-label">STATUS</div>
      <div class="status-value" id="statusData"
           style="font-size:14px">MEMUAT</div>
    </div>

  </section>

  <main class="panel">

    <div class="toolbar">

      <div class="search-box">
        <input
          id="cari"
          type="search"
          placeholder="Cari HARI, KODE PRODUK, WOM, MOTIF..."
          autocomplete="off"
          aria-label="Cari data planning">
      </div>

      <button id="btnMuat" onclick="muatData()">
        ↻ MUAT ULANG
      </button>

    </div>

    <div class="info-line">
      <span id="infoJumlah">Menyiapkan data...</span>
      <span id="waktuUpdate">Belum diperbarui</span>
    </div>

    <div id="pesan" class="message"></div>

    <div class="table-wrapper">
      <table>
        <thead id="kepalaTabel"></thead>

        <tbody id="isiTabel">
          <tr>
            <td class="empty">Sedang mengambil data...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>

  <footer class="footer">
    PLANNING 1 · PROTOTYPE#4<br>
    Data ditampilkan dari Google Spreadsheet
  </footer>

</div>

<script>
'use strict';

// =====================================================
// URL WEB APP GOOGLE APPS SCRIPT
// =====================================================

const API_URL =
  'https://script.google.com/macros/s/AKfycby6Rt8Xv-bXS8BaFcQ7vDk7ZBg1PZeVvgly8wDokO2f9ZKcGGGWnyU2z0AkI2CL0iP1Zw/exec';

// =====================================================
// PENYIMPANAN DATA
// =====================================================

let semuaData = [];

/*
 * headerRows menyimpan header asli.
 * Jika API mengirim 3 baris, ketiganya dipertahankan.
 * Jika API hanya mengirim 1 baris, tidak dibuat header
 * tambahan Produksi atau Warna.
 */

let headerRows = [];
let headerData = [];

let sedangMemuat = false;

// =====================================================
// ELEMEN HTML
// =====================================================

const el = id => document.getElementById(id);

// =====================================================
// ESCAPE HTML
// =====================================================

function aman(teks) {
  return String(teks ?? '').replace(/[&<>"']/g, function(c) {
    return {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[c];
  });
}

// =====================================================
// NORMALISASI NAMA KOLOM
// =====================================================

function normalisasi(teks) {
  return String(teks ?? '')
    .toLocaleLowerCase('id-ID')
    .replace(/\s+/g, ' ')
    .trim();
}

// =====================================================
// MENYIAPKAN STRUKTUR HEADER API
// =====================================================

function siapkanHeader(headerAPI) {

  if (!Array.isArray(headerAPI)) {
    throw new Error('Format header API tidak berupa array.');
  }

  /*
   * API dapat mengirim:
   *
   * Format A:
   * header: ["HARI", "TANGGAL", "FP", ...]
   *
   * Format B:
   * header: [
   *   ["HARI", "TANGGAL", "FP", ...],
   *   ["", "", "", ...],
   *   ["", "", "", ...]
   * ]
   *
   * Tidak membuat kelompok Produksi/Warna tambahan.
   */

  if (
    headerAPI.length > 0 &&
    Array.isArray(headerAPI[0])
  ) {

    headerRows = headerAPI.map(function(baris) {
      return Array.isArray(baris) ? baris : [];
    });

  } else {

    headerRows = [headerAPI];

  }

  /*
   * Baris header terakhir dipakai sebagai nama kolom utama.
   * Jika nama kolom pada posisi tertentu kosong, pencarian
   * nama kolom akan memeriksa baris header lainnya.
   */

  headerData = headerRows.length
    ? headerRows[headerRows.length - 1].slice()
    : [];

  const jumlahKolom = Math.max(
    0,
    ...headerRows.map(baris => baris.length)
  );

  while (headerData.length < jumlahKolom) {
    headerData.push('');
  }

  /*
   * Jika sel di baris header terakhir kosong, gunakan nama
   * dari baris header sebelumnya pada posisi yang sama.
   * Ini membantu pencarian kolom FP dan DEV (Pcs).
   */

  for (let kolom = 0; kolom < jumlahKolom; kolom++) {

    if (String(headerData[kolom] ?? '').trim() !== '') {
      continue;
    }

    for (let baris = headerRows.length - 2; baris >= 0; baris--) {

      const nilai = String(
        headerRows[baris][kolom] ?? ''
      ).trim();

      if (nilai !== '') {
        headerData[kolom] = nilai;
        break;
      }

    }

  }

}

// =====================================================
// MENCARI INDEKS KOLOM DARI SEMUA HEADER ASLI
// =====================================================

function cariKolom(nama) {

  const target = normalisasi(nama);

  const jumlahKolom = Math.max(
    headerData.length,
    ...headerRows.map(baris => baris.length)
  );

  for (let kolom = 0; kolom < jumlahKolom; kolom++) {

    /*
     * Prioritaskan nama kolom pada header terakhir.
     */

    if (normalisasi(headerData[kolom]) === target) {
      return kolom;
    }

    /*
     * Jika belum ketemu, periksa tiga baris header asli.
     */

    for (let baris = headerRows.length - 1; baris >= 0; baris--) {

      if (
        normalisasi(headerRows[baris][kolom]) === target
      ) {
        return kolom;
      }

    }

  }

  return -1;

}

// =====================================================
// INDEKS FP
// =====================================================

function indeksFP() {
  return cariKolom('FP');
}

// =====================================================
// INDEKS DEV (Pcs)
// =====================================================

function indeksDev() {

  const variasi = [
    'dev (pcs)',
    'dev(pcs)',
    'dev pcs',
    'dev'
  ];

  for (const nama of variasi) {

    const index = cariKolom(nama);

    if (index !== -1) {
      return index;
    }

  }

  return -1;

}

// =====================================================
// FILTER BARIS TANPA FP
// =====================================================

function dataDenganFP() {

  const index = indeksFP();

  if (index === -1) {
    return [];
  }

  return semuaData.filter(function(baris) {

    return String(baris[index] ?? '').trim() !== '';

  });

}

// =====================================================
// KELAS WARNA FP
// =====================================================

function kelasFP(baris) {

  const index = indeksFP();

  if (index === -1) {
    return '';
  }

  const fp = String(baris[index] ?? '').trim();

  const daftar = {
    '1': 'fp-1',
    '2': 'fp-2',
    '4': 'fp-4',
    '5': 'fp-5',
    '6': 'fp-6',
    '7': 'fp-7'
  };

  return daftar[fp] || '';

}

// =====================================================
// PESAN STATUS
// =====================================================

function tampilPesan(teks, jenis) {

  const kotak = el('pesan');

  kotak.className = 'message ' + jenis;
  kotak.textContent = teks;

}

function hapusPesan() {

  const kotak = el('pesan');

  kotak.className = 'message';
  kotak.textContent = '';

}

// =====================================================
// AMBIL DATA APPS SCRIPT
// =====================================================

async function muatData() {

  if (sedangMemuat) {
    return;
  }

  sedangMemuat = true;

  el('btnMuat').disabled = true;
  el('btnMuat').textContent = 'MEMUAT...';
  el('statusData').textContent = 'MEMUAT';

  hapusPesan();

  if (semuaData.length === 0) {

    el('isiTabel').innerHTML =
      '<tr><td class="empty">Sedang mengambil data...</td></tr>';

  }

  try {

    const url = API_URL +
      (API_URL.includes('?') ? '&' : '?') +
      '_=' + Date.now();

    const response = await fetch(url, {
      method: 'GET',
      redirect: 'follow',
      cache: 'no-store'
    });

    if (!response.ok) {
      throw new Error('HTTP ' + response.status);
    }

    const hasil = await response.json();

    if (!hasil || hasil.sukses !== true) {

      throw new Error(
        hasil && hasil.error
          ? hasil.error
          : 'Format data API tidak sesuai.'
      );

    }

    if (
      !Array.isArray(hasil.header) ||
      !Array.isArray(hasil.data)
    ) {

      throw new Error(
        'Header atau data tidak ditemukan.'
      );

    }

    siapkanHeader(hasil.header);

    semuaData = hasil.data;

    el('statusData').textContent = 'ONLINE';

    el('waktuUpdate').textContent =
      'Diperbarui: ' +
      new Date().toLocaleTimeString('id-ID');

    tampilkanTabel();

    if (indeksFP() === -1) {

      tampilPesan(
        'Data berhasil dimuat, tetapi header FP tidak ditemukan. ' +
        'Periksa nama kolom FP pada spreadsheet.',
        'error'
      );

    } else {

      tampilPesan(
        'Data berhasil dimuat. Baris tanpa FP disembunyikan.',
        'success'
      );

    }

  } catch (error) {

    console.error(error);

    el('statusData').textContent = 'ERROR';

    tampilPesan(
      'Data gagal dimuat. Periksa deployment Apps Script, ' +
      'izin akses Web App, dan apakah API dapat dibuka. ' +
      'Detail: ' + error.message,
      'error'
    );

    if (semuaData.length === 0) {

      el('kepalaTabel').innerHTML = '';

      el('isiTabel').innerHTML =
        '<tr><td class="empty">' +
        'Data belum berhasil dimuat. Tekan MUAT ULANG setelah memperbaiki API.' +
        '</td></tr>';

      el('infoJumlah').textContent = 'Data tidak tersedia';
      el('hasilData').textContent = '0';

    }

  } finally {

    sedangMemuat = false;

    el('btnMuat').disabled = false;
    el('btnMuat').textContent = '↻ MUAT ULANG';

  }

}

// =====================================================
// MEMBANGUN HEADER ASLI
//
// Tidak membuat header kelompok Produksi/Warna.
// Semua baris header yang dikirim API dipertahankan.
// =====================================================

function buatHeader() {

  if (!headerRows.length) {

    el('kepalaTabel').innerHTML = '';
    return;

  }

  const jumlahKolom = Math.max(
    0,
    ...headerRows.map(baris => baris.length)
  );

  const indexDev = indeksDev();

  const html = headerRows.map(function(baris) {

    let sel = '';

    for (let kolom = 0; kolom < jumlahKolom; kolom++) {

      const nilai = baris[kolom] ?? '';

      const kelasDev =
        kolom === indexDev
          ? ' class="dev-header"'
          : '';

      sel +=
        '<th' + kelasDev + '>' +
        aman(nilai) +
        '</th>';

    }

    return '<tr>' + sel + '</tr>';

  }).join('');

  el('kepalaTabel').innerHTML = html;

}

// =====================================================
// TAMPILKAN TABEL
// =====================================================

function tampilkanTabel() {

  const kata = el('cari').value
    .trim()
    .toLocaleLowerCase('id-ID');

  const dataAktif = dataDenganFP();

  const hasil = dataAktif.filter(function(baris) {

    return baris.some(function(nilai) {

      return String(nilai ?? '')
        .toLocaleLowerCase('id-ID')
        .includes(kata);

    });

  });

  buatHeader();

  if (hasil.length === 0) {

    el('isiTabel').innerHTML =
      '<tr><td class="empty" colspan="' +
      Math.max(headerData.length, 1) +
      '">' +
      (
        dataAktif.length === 0
          ? 'Tidak ada baris dengan FP terisi.'
          : 'Data tidak ditemukan.'
      ) +
      '</td></tr>';

  } else {

    const indexDev = indeksDev();

    el('isiTabel').innerHTML = hasil.map(function(baris) {

      const kelas = kelasFP(baris);

      const sel = headerData.map(function(_, index) {

        const kelasDev =
          index === indexDev
            ? ' class="dev-pcs"'
            : '';

        return '<td' + kelasDev + '>' +
          aman(baris[index] ?? '') +
          '</td>';

      }).join('');

      return '<tr class="' + kelas + '">' +
        sel +
        '</tr>';

    }).join('');

  }

  el('totalData').textContent =
    dataAktif.length.toLocaleString('id-ID');

  el('hasilData').textContent =
    hasil.length.toLocaleString('id-ID');

  el('infoJumlah').textContent =
    'Menampilkan ' +
    hasil.length.toLocaleString('id-ID') +
    ' dari ' +
    dataAktif.length.toLocaleString('id-ID') +
    ' baris ber-FP';

}

// =====================================================
// PENCARIAN LANGSUNG
// =====================================================

el('cari').addEventListener(
  'input',
  tampilkanTabel
);

// =====================================================
// MULAI APLIKASI
// =====================================================

muatData();

</script>

</body>
</html>
